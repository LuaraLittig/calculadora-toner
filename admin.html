<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área ADM - Cadastro de Toners</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="box">

    <div class="logo-topo">
      <img src="logo.png" alt="Logo Supriservice">
    </div>

    <div id="loginBox">
      <h2>Login ADM</h2>
      <p>Digite usuário e senha para acessar</p>

      <input type="text" id="usuario" placeholder="Usuário">
      <input type="password" id="senha" placeholder="Senha">

      <button onclick="login()">Entrar</button>

      <div id="erroLogin" class="mensagem erro"></div>

      <a href="index.html" class="link-admin">⬅ Voltar para Calculadora</a>
    </div>

    <div id="admBox" style="display:none;">
      <h2>Área Administrativa</h2>
      <p>Cadastrar, editar e remover modelos de toner</p>

      <input type="text" id="nome" placeholder="Nome do toner">
      <input type="text" id="codigo" placeholder="Código interno">
      <input type="number" id="cheio" placeholder="Peso cheio">
      <input type="number" id="vazio" placeholder="Peso vazio">

      <button id="btnCadastrar" onclick="cadastrar()">Cadastrar</button>
      <button id="btnAtualizar" onclick="atualizar()" style="display:none;">Atualizar</button>

      <button class="btn-sair" onclick="logout()">Sair</button>

      <a href="index.html" class="link-admin">⬅ Voltar para Calculadora</a>

      <div id="erro" class="mensagem erro"></div>
      <div id="sucesso" class="mensagem sucesso"></div>

      <hr style="margin:20px 0; border:1px solid #334155;">

      <h3 style="text-align:center;">📋 Toners Cadastrados</h3>

      <div id="listaToners"></div>
    </div>

  </div>

  <script src="admin.js"></script>

</body>

</html>
